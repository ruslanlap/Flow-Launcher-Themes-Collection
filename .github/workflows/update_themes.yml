name: 🧠 Weekly Flow Launcher Theme Sync

on: 
  schedule:
    - cron: '0 0 1,15 * *'  # 00:00 UTC 1-го та 15-го числа к��жного місяця (приблизно кожні 2 тижні)
  workflow_dispatch:
  push: 
    branches: [master]

# Не запускай паралельні синки
concurrency: 
  group: theme-sync-${{ github.ref }}
  cancel-in-progress: true

# Мінімальні глобальні права; більші — лише там, де треба
permissions:
  contents: read
  pull-requests: write

jobs:
  update:
    name: 🔄 Fetch & Update Themes
    runs-on: ubuntu-latest
    permissions:
      contents: write        # для commit у гілку PR
      pull-requests: write   # для створення PR
    env: 
      PYTHONUNBUFFERED: '1'
      # GITHUB_TOKEN вже доступний автоматично; якщо колись треба PAT (напр. крос-репо) —
      # додай секрет PAT_TOKEN і використай його всередині скрипта як fallback.
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses:  actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📥 Install deps
        run: |
          python -m pip install -U pip
          python -m pip install requests

      - name: 📡 Run Theme Sync Script
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}   # опційно; якщо не заданий — скрипт просто ігнорує
        run: python update_themes.py

      # Створюємо PR з фіксованою гілкою — peter-evans оновить існуючий PR замість створення нового
      - name: 📬 Create Pull Request
        id: cpr
        uses:  peter-evans/create-pull-request@v6
        with: 
          commit-message: "🧵 Auto-update themes & README ✨"
          title: "chore(theme-sync): weekly auto-update"
          body: |
            Automated weekly sync.
            - Event: ${{ github.event_name }}
            - Run: ${{ github.run_id }}
          branch: chore/theme-sync
          delete-branch: true
          signoff: true
          labels: |
            chore
            automated

      # Автоматично мержимо PR якщо він створений/оновлений і немає конфліктів
      - name: ✅ Auto-merge Pull Request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number }}"
          echo "Auto-merging PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash --auto --delete-branch || echo "Auto-merge enabled (will merge when checks pass)"
